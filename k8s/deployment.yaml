apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-webui
  namespace: default
  labels:
    app: slurm-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slurm-webui
  template:
    metadata:
      labels:
        app: slurm-webui
    spec:
      containers:
        - name: slurm-webui
          image: harbor.wistron.com/k8sprdwhqaiml/slurm/slurm-webui:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: slurm-webui-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
